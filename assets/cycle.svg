  <circle cx="300.9" cy="107.5" r="22" fill="#2f81f7" fill-opacity="0.12" stroke="#2f81f7" stroke-width="2"/>
  <text x="300.9" y="112.5" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#2f81f7">2</text>
  <circle cx="300.9" cy="212.5" r="22" fill="#2f81f7" fill-opacity="0.12" stroke="#2f81f7" stroke-width="2"/>
  <text x="300.9" y="217.5" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#2f81f7">3</text>
  <circle cx="210.0" cy="265.0" r="22" fill="#2f81f7" fill-opacity="0.12" stroke="#2f81f7" stroke-width="2"/>
  <text x="210.0" y="270.0" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#2f81f7">4</text>
  <circle cx="119.1" cy="212.5" r="22" fill="#2f81f7" fill-opacity="0.12" stroke="#2f81f7" stroke-width="2"/>
