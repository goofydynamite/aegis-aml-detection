    <line x1="189.2" y1="253.0" x2="143.3" y2="226.5" stroke="#2f81f7" stroke-width="3"/>
    <path d="M0,-6 L10,0 L0,6 Z" fill="#2f81f7" transform="translate(143.3,226.5) rotate(-150.0)"/>
  </g>
  <g opacity="0.15">
