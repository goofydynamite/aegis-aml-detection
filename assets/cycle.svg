  <circle cx="119.1" cy="107.5" r="22" fill="#2f81f7" fill-opacity="0.12" stroke="#2f81f7" stroke-width="2"/>
  <text x="119.1" y="112.5" text-anchor="middle" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="14" font-weight="600" fill="#2f81f7">6</text>
  <text x="370" y="105" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" font-weight="400" fill="#8b949e" opacity="1">Payments 1 → 2 → … → 6 build a chain
  </text>
  <text x="370" y="135" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" font-weight="400" fill="#8b949e" opacity="1">chain depth grows each hop: 0, 1, 2, 3, 4
  </text>
  <text x="370" y="165" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" font-weight="400" fill="#e5534b" opacity="0">Payment 6 → 1 closes a 6-hop cycle
    <animate attributeName="opacity" dur="9.0s" repeatCount="indefinite"
             keyTimes="0;0.770;0.800;0.94;1" values="0;0;1;1;0"/>
  </text>
  <text x="370" y="195" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" font-weight="400" fill="#8b949e" opacity="0">Model score only 0.029, below threshold
    <animate attributeName="opacity" dur="9.0s" repeatCount="indefinite"
             keyTimes="0;0.770;0.800;0.94;1" values="0;0;1;1;0"/>
  </text>
  <text x="370" y="225" font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size="16" font-weight="700" fill="#e5534b" opacity="0">ALERT  ·  triggered by: cycle rule
    <animate attributeName="opacity" dur="9.0s" repeatCount="indefinite"
             keyTimes="0;0.770;0.800;0.94;1" values="0;0;1;1;0"/>
  </text>
